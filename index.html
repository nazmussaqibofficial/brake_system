<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brake Hydraulic Ratio Calculator by Mr.Q</title>
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ff5722;
            --border-color: #333333;
            --result-bg: #2c2c2c;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--text-color);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #bbbbbb;
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input[type="number"]:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .helper-text {
            font-size: 0.8rem;
            color: #888888;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #e64a19;
        }

        .results {
            display: none;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .ratio-highlight {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
            text-align: center;
            margin: 20px 0;
        }

        .verdict-box {
            background-color: var(--result-bg);
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid var(--accent-color);
        }

        .verdict-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 1.1rem;
        }

        .verdict-notes {
            font-size: 0.85rem;
            color: #cccccc;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Brake Hydraulic Ratio Calculator By Mr.Q</h1>

        <div class="input-group">
            <label for="numCalipers">Number of Calipers on Wheel</label>
            <select id="numCalipers">
                <option value="1">1 (Single Disc)</option>
                <option value="2">2 (Dual Disc)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="pistonSetup">Caliper Piston Configuration</label>
            <select id="pistonSetup" onchange="toggleSetup()">
                <option value="uniform">Uniform (All pistons are the same size)</option>
                <option value="staggered">Staggered (4-Piston: 2 large + 2 small)</option>
            </select>
        </div>

        <!-- Inputs for Uniform Pistons -->
        <div id="uniformInputs">
            <div class="input-group">
                <label for="calDia">Piston Diameter (mm)</label>
                <input type="number" id="calDia" placeholder="e.g., 32" step="0.1">
            </div>
            <div class="input-group">
                <label for="numPistonsPerCaliper">Pistons PER Caliper (e.g., 2, 4)</label>
                <input type="number" id="numPistonsPerCaliper" placeholder="e.g., 4">
            </div>
        </div>

        <!-- Inputs for Staggered Pistons -->
        <div id="staggeredInputs" style="display: none;">
            <div class="input-group">
                <label for="calDia1">Large Piston Diameter (mm)</label>
                <input type="number" id="calDia1" placeholder="e.g., 34" step="0.1">
            </div>
            <div class="input-group">
                <label for="calDia2">Small Piston Diameter (mm)</label>
                <input type="number" id="calDia2" placeholder="e.g., 30" step="0.1">
            </div>
            <div class="helper-text">*Calculation assumes 2 pistons of the large size and 2 pistons of the small size inside each caliper.</div>
        </div>

        <div class="input-group" style="margin-top: 10px;">
            <label for="mcDia">Master Cylinder Bore (mm)</label>
            <input type="number" id="mcDia" placeholder="e.g., 14" step="0.1">
        </div>

        <button onclick="calculateRatio()">Calculate Ratio</button>

        <div class="results" id="results">
            <div class="result-item">
                <span>Total Caliper Area:</span>
                <span id="totalArea">0.00 mm²</span>
            </div>
            <div class="result-item">
                <span>Master Cylinder Area:</span>
                <span id="mcArea">0.00 mm²</span>
            </div>
            
            <div class="ratio-highlight"> 
                 <span id="ratioResult"></span>
            </div>

            <div class="verdict-box">
                <div class="verdict-title" id="verdict">VERDICT</div>
                <div class="verdict-notes" id="notes">Notes will appear here.</div>
            </div>
        </div>
    </div>

    <script>
        function toggleSetup() {
            const setup = document.getElementById('pistonSetup').value;
            if (setup === 'uniform') {
                document.getElementById('uniformInputs').style.display = 'block';
                document.getElementById('staggeredInputs').style.display = 'none';
            } else {
                document.getElementById('uniformInputs').style.display = 'none';
                document.getElementById('staggeredInputs').style.display = 'block';
            }
            // Hide results when switching configs to avoid confusion
            document.getElementById('results').style.display = 'none';
        }

        function calculateRatio() {
            const numCalipers = parseInt(document.getElementById('numCalipers').value);
            const setup = document.getElementById('pistonSetup').value;
            const mcDia = parseFloat(document.getElementById('mcDia').value);

            if (!mcDia || mcDia <= 0) {
                alert("Please enter a valid Master Cylinder Bore.");
                return;
            }

            let totalCaliperArea = 0;

            if (setup === 'uniform') {
                const calDia = parseFloat(document.getElementById('calDia').value);
                const numPistonsPerCaliper = parseInt(document.getElementById('numPistonsPerCaliper').value);
                
                if (!calDia || !numPistonsPerCaliper || calDia <= 0 || numPistonsPerCaliper <= 0) {
                    alert("Please enter valid numbers for uniform piston diameter and quantity.");
                    return;
                }
                const singleCaliperArea = (Math.PI * Math.pow(calDia, 2)) / 4.0;
                totalCaliperArea = singleCaliperArea * numPistonsPerCaliper * numCalipers;
                
            } else {
                const calDia1 = parseFloat(document.getElementById('calDia1').value);
                const calDia2 = parseFloat(document.getElementById('calDia2').value);
                
                if (!calDia1 || !calDia2 || calDia1 <= 0 || calDia2 <= 0) {
                    alert("Please enter valid numbers for both staggered piston sizes.");
                    return;
                }
                // Calculate area of two Large pistons + two Small pistons per caliper
                const areaLargePair = 2 * ((Math.PI * Math.pow(calDia1, 2)) / 4.0);
                const areaSmallPair = 2 * ((Math.PI * Math.pow(calDia2, 2)) / 4.0);
                
                const singleCaliperArea = areaLargePair + areaSmallPair;
                totalCaliperArea = singleCaliperArea * numCalipers;
            }

            // Master Cylinder Calculation
            const mcArea = (Math.PI * Math.pow(mcDia, 2)) / 4.0;
            const ratio = totalCaliperArea / mcArea;

            // Determine Verdict
            let verdict = "";
            let notes = "";

            if (ratio < 10.0) {
                verdict = "WOODEN / STIFF";
                notes = "Insufficient leverage. Requires extremely high hand effort for minimal stopping power. Lever will barely move.";
            } else if (ratio >= 10.0 && ratio < 14.0) {
                verdict = "ACCEPTABLE"; /*FIRM / CRISP*/
                notes = "Sport profile. Excellent feedback with short lever travel. Great for track or aggressive street riding.";
            } else if (ratio >= 14.0 && ratio <= 18.0) {
                verdict = "ACCEPTABLE"; /*PROGRESSIVE / HIGH LEVERAGE*/
                notes = "The sweet spot for everyday street riding. Excellent modulation and stopping power without excess fatigue.";
            } else {
                verdict = "MUSHY / SOFT";
                notes = "Dangerously high ratio. High risk of pulling the lever all the way to the grip before achieving maximum braking force.";
            }

            // Update UI
            document.getElementById('totalArea').innerText = totalCaliperArea.toFixed(2) + " mm²";
            document.getElementById('mcArea').innerText = mcArea.toFixed(2) + " mm²";
           /* document.getElementById('ratioResult').innerText = ratio.toFixed(2) + " : 1"; */
            document.getElementById('verdict').innerText = verdict;
            document.getElementById('notes').innerText = notes;
            
            // Reveal the results block
            document.getElementById('results').style.display = 'block';
        }
    </script>
</body>
</html>
